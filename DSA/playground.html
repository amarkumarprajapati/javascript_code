<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS DSA Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- CodeMirror for a smooth code editing experience -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <style>
    :root {
      --bg-main: #0d1117;
      --bg-panel: #161b22;
      --border-color: #30363d;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --success: #2ea043;
      --danger: #f85149;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --console-bg: #090d12;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.72rem;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(88, 166, 255, 0.3);
      font-weight: 600;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select, button {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 7px 14px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    select {
      background-color: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    select:hover {
      border-color: var(--accent);
    }

    button {
      font-weight: 600;
      border: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-run {
      background-color: var(--success);
      color: #fff;
    }

    .btn-run:hover {
      background-color: #2c974b;
      transform: translateY(-1px);
    }

    .btn-clear {
      background-color: #21262d;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-clear:hover {
      background-color: #30363d;
    }

    .btn-reset {
      background-color: #21262d;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-reset:hover {
      background-color: #30363d;
    }

    .main-workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    @media (max-width: 900px) {
      .main-workspace {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }

    .pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--border-color);
    }

    .pane:last-child {
      border-right: none;
    }

    .pane-header {
      background-color: #1c2128;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'Fira Code', monospace;
    }

    .editor-container {
      flex: 1;
      height: 100%;
      overflow: hidden;
      font-size: 14px;
      background-color: #0d1117;
    }

    #code-editor {
      width: 100%;
      height: 100%;
      background-color: #0d1117;
      color: #e6edf3;
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      line-height: 1.6;
      padding: 16px;
      border: none;
      outline: none;
      resize: none;
      white-space: pre;
    }

    /* Fallback dark styles and full coverage for CodeMirror */
    .CodeMirror,
    .cm-s-dracula.CodeMirror,
    .CodeMirror-wrap {
      height: 100% !important;
      font-family: 'Fira Code', monospace;
      line-height: 1.6;
      background-color: #0d1117 !important;
      color: #f8f8f2 !important;
    }

    .CodeMirror-gutters,
    .cm-s-dracula .CodeMirror-gutters {
      background-color: #161b22 !important;
      border-right: 1px solid var(--border-color) !important;
    }

    .CodeMirror-linenumber {
      color: #484f58 !important;
    }

    .CodeMirror-cursor {
      border-left: 2px solid #58a6ff !important;
    }

    .CodeMirror-selected,
    .CodeMirror-focused .CodeMirror-selected {
      background: #264f78 !important;
    }

    /* Dark Syntax Highlight Tokens */
    .cm-s-dracula span.cm-keyword { color: #ff7b72 !important; font-weight: 600; }
    .cm-s-dracula span.cm-def { color: #d2a8ff !important; }
    .cm-s-dracula span.cm-variable { color: #c9d1d9 !important; }
    .cm-s-dracula span.cm-variable-2 { color: #79c0ff !important; }
    .cm-s-dracula span.cm-variable-3 { color: #ffa657 !important; }
    .cm-s-dracula span.cm-property { color: #79c0ff !important; }
    .cm-s-dracula span.cm-operator { color: #ff7b72 !important; }
    .cm-s-dracula span.cm-string { color: #a5d6ff !important; }
    .cm-s-dracula span.cm-number { color: #79c0ff !important; }
    .cm-s-dracula span.cm-comment { color: #8b949e !important; font-style: italic; }
    .cm-s-dracula span.cm-atom { color: #ff7b72 !important; }
    .cm-s-dracula span.cm-builtin { color: #ffa657 !important; }

    .console-pane {
      background-color: var(--console-bg);
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
    }

    .log-line {
      margin-bottom: 6px;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: pre-wrap;
      word-break: break-all;
      border-left: 3px solid transparent;
      animation: fadeIn 0.15s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .log-info {
      color: #e6edf3;
      border-left-color: var(--accent);
      background: rgba(88, 166, 255, 0.05);
    }

    .log-warn {
      color: #d29922;
      border-left-color: #d29922;
      background: rgba(210, 153, 34, 0.08);
    }

    .log-error {
      color: #f85149;
      border-left-color: var(--danger);
      background: rgba(248, 81, 73, 0.1);
    }

    .log-success {
      color: #3fb950;
      border-left-color: #3fb950;
      background: rgba(63, 185, 80, 0.08);
    }

    .empty-console {
      color: var(--text-muted);
      text-align: center;
      margin-top: 50px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>⚡ DSA Practice Playground</h1>
      <span class="badge">JavaScript</span>
    </div>

    <div class="actions">
      <select id="preset-selector" title="Choose template snippet">
        <option value="scratch">Blank Playground</option>
        <option value="twoSum">1. Two Sum (Hashing)</option>
        <option value="reverseList">2. Reverse Linked List</option>
        <option value="binarySearch">3. Binary Search</option>
        <option value="slidingWindow">4. Sliding Window (Max Sum)</option>
        <option value="validParentheses">5. Valid Parentheses (Stack)</option>
        <option value="bfsTree">6. Tree BFS Level Order</option>
      </select>
      <button class="btn-reset" id="btn-reset" title="Reset snippet to default">Reset</button>
      <button class="btn-clear" id="btn-clear" title="Clear Console Output">Clear Console</button>
      <button class="btn-run" id="btn-run">▶ Run (Ctrl + Enter)</button>
    </div>
  </header>

  <div class="main-workspace">
    <!-- Code Editor Column -->
    <div class="pane">
      <div class="pane-header">
        <span>JavaScript Editor</span>
        <span class="status-tag">Auto-Saved</span>
      </div>
      <div class="editor-container">
        <textarea id="code-editor"></textarea>
      </div>
    </div>

    <!-- Output Console Column -->
    <div class="pane">
      <div class="pane-header">
        <span>Console & Execution Output</span>
        <span id="execution-time" class="status-tag">Ready</span>
      </div>
      <div class="console-pane" id="console-output">
        <div class="empty-console">Run your code with ▶ or press (Ctrl + Enter) to see console output.</div>
      </div>
    </div>
  </div>

  <script>
    const presets = {
      scratch: '',
      twoSum: `// LeetCode 1: Two Sum
// Problem: Given an array of integers nums and an integer target,
// return indices of the two numbers such that they add up to target.

function twoSum(nums, target) {
  const map = new Map(); // value -> index
  for (let i = 0; i < nums.length; i++) {
    const diff = target - nums[i];
    if (map.has(diff)) {
      return [map.get(diff), i];
    }
    map.set(nums[i], i);
  }
  return [];
}

console.log("Input: nums = [2, 7, 11, 15], target = 9");
console.log("Result:", twoSum([2, 7, 11, 15], 9)); // Output: [0, 1]

console.log("Input: nums = [3, 2, 4], target = 6");
console.log("Result:", twoSum([3, 2, 4], 6)); // Output: [1, 2]
`,
      reverseList: `// LeetCode 206: Reverse Linked List
class ListNode {
  constructor(val = 0, next = null) {
    this.val = val;
    this.next = next;
  }
}

// Helper: array to linked list
function arrayToList(arr) {
  let dummy = new ListNode(0);
  let curr = dummy;
  for (const n of arr) {
    curr.next = new ListNode(n);
    curr = curr.next;
  }
  return dummy.next;
}

// Helper: list to array for easy printing
function listToArray(head) {
  const res = [];
  while (head) {
    res.push(head.val);
    head = head.next;
  }
  return res;
}

function reverseList(head) {
  let prev = null;
  let curr = head;
  while (curr) {
    let next = curr.next;
    curr.next = prev;
    prev = curr;
    curr = next;
  }
  return prev;
}

const list = arrayToList([1, 2, 3, 4, 5]);
console.log("Original List:", listToArray(list));
const reversed = reverseList(list);
console.log("Reversed List:", listToArray(reversed));
`,
      binarySearch: `// Binary Search: O(log n)
function binarySearch(arr, target) {
  let left = 0;
  let right = arr.length - 1;

  while (left <= right) {
    const mid = Math.floor((left + right) / 2);
    if (arr[mid] === target) return mid;
    if (arr[mid] < target) left = mid + 1;
    else right = mid - 1;
  }
  return -1;
}

const sorted = [1, 3, 5, 7, 9, 11, 15, 20];
console.log("Index of 7:", binarySearch(sorted, 7)); // 3
console.log("Index of 12:", binarySearch(sorted, 12)); // -1
`,
      slidingWindow: `// Maximum Sum Subarray of size K (Sliding Window)
function maxSubArraySum(arr, k) {
  if (arr.length < k) return null;

  let windowSum = 0;
  for (let i = 0; i < k; i++) windowSum += arr[i];
  let maxSum = windowSum;

  for (let i = k; i < arr.length; i++) {
    windowSum += arr[i] - arr[i - k];
    maxSum = Math.max(maxSum, windowSum);
  }
  return maxSum;
}

const nums = [2, 1, 5, 1, 3, 2];
const k = 3;
console.log("Max sum of subarray size " + k + ":", maxSubArraySum(nums, k)); // 9 ([5, 1, 3])
`,
      validParentheses: `// LeetCode 20: Valid Parentheses (Stack)
function isValid(s) {
  const stack = [];
  const map = {
    ')': '(',
    '}': '{',
    ']': '['
  };

  for (const char of s) {
    if (char === '(' || char === '{' || char === '[') {
      stack.push(char);
    } else {
      if (stack.length === 0 || stack.pop() !== map[char]) {
        return false;
      }
    }
  }
  return stack.length === 0;
}

console.log("()[]{} ->", isValid("()[]{}")); // true
console.log("(]     ->", isValid("(]"));     // false
console.log("([)]   ->", isValid("([)]"));   // false
console.log("{[]}   ->", isValid("{[]}"));   // true
`,
      bfsTree: `// Binary Tree Breadth First Search (Level Order Traversal)
class TreeNode {
  constructor(val, left = null, right = null) {
    this.val = val;
    this.left = left;
    this.right = right;
  }
}

function levelOrder(root) {
  if (!root) return [];
  const result = [];
  const queue = [root];

  while (queue.length > 0) {
    const levelSize = queue.length;
    const currentLevel = [];

    for (let i = 0; i < levelSize; i++) {
      const node = queue.shift();
      currentLevel.push(node.val);
      if (node.left) queue.push(node.left);
      if (node.right) queue.push(node.right);
    }
    result.push(currentLevel);
  }
  return result;
}

// Construct:
//      3
//     / \\
//    9  20
//       /  \\
//      15   7
const root = new TreeNode(3, new TreeNode(9), new TreeNode(20, new TreeNode(15), new TreeNode(7)));
console.log("Level Order Traversal:", levelOrder(root));
`
    };

    // Initialize CodeMirror with fallback handling
    const textarea = document.getElementById('code-editor');
    let editor;
    const savedCode = localStorage.getItem('dsa_playground_code') ?? '';

    if (window.CodeMirror) {
      editor = CodeMirror.fromTextArea(textarea, {
        mode: 'javascript',
        theme: 'dracula',
        lineNumbers: true,
        autoCloseBrackets: true,
        matchBrackets: true,
        tabSize: 2,
        indentWithTabs: false
      });
      editor.setValue(savedCode);
      editor.on('change', () => {
        localStorage.setItem('dsa_playground_code', editor.getValue());
      });
      setTimeout(() => editor.refresh(), 100);
    } else {
      // Fallback to pure textarea if CDN is blocked or offline
      textarea.value = savedCode;
      textarea.addEventListener('input', () => {
        localStorage.setItem('dsa_playground_code', textarea.value);
      });
      editor = {
        getValue: () => textarea.value,
        setValue: (val) => { textarea.value = val; },
        refresh: () => {}
      };
    }

    const consoleOutput = document.getElementById('console-output');
    const executionTimeEl = document.getElementById('execution-time');

    function appendLog(type, args) {
      const empty = consoleOutput.querySelector('.empty-console');
      if (empty) empty.remove();

      const line = document.createElement('div');
      line.className = 'log-line log-' + type;

      const formatted = args.map(arg => {
        if (arg === undefined) return 'undefined';
        if (arg === null) return 'null';
        if (typeof arg === 'function') return arg.toString();
        if (typeof arg === 'symbol') return arg.toString();
        if (typeof arg === 'bigint') return arg.toString() + 'n';
        if (arg instanceof Error) {
          return `${arg.name}: ${arg.message}${arg.stack ? '\n' + arg.stack : ''}`;
        }
        if (typeof arg === 'object') {
          try {
            return JSON.stringify(arg, null, 2);
          } catch (e) {
            return String(arg);
          }
        }
        return String(arg);
      }).join(' ');

      line.textContent = formatted;
      consoleOutput.appendChild(line);
      consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    function clearConsole() {
      consoleOutput.innerHTML = '';
      executionTimeEl.textContent = 'Ready';
    }

    function executeCode() {
      clearConsole();
      const code = editor.getValue();
      const startTime = performance.now();

      // Intercept console
      const originalLog = console.log;
      const originalWarn = console.warn;
      const originalError = console.error;

      console.log = (...args) => {
        appendLog('info', args);
        originalLog(...args);
      };
      console.warn = (...args) => {
        appendLog('warn', args);
        originalWarn(...args);
      };
      console.error = (...args) => {
        appendLog('error', args);
        originalError(...args);
      };

      try {
        const runFn = new Function(code);
        runFn();
        const duration = (performance.now() - startTime).toFixed(2);
        executionTimeEl.textContent = `Done in ${duration}ms`;
        appendLog('success', [`✔ Execution finished in ${duration}ms`]);
      } catch (err) {
        appendLog('error', [err]);
        executionTimeEl.textContent = 'Error';
      } finally {
        console.log = originalLog;
        console.warn = originalWarn;
        console.error = originalError;
      }
    }

    document.getElementById('btn-run').addEventListener('click', executeCode);
    document.getElementById('btn-clear').addEventListener('click', clearConsole);

    document.getElementById('preset-selector').addEventListener('change', (e) => {
      const selected = e.target.value;
      if (presets[selected] !== undefined) {
        editor.setValue(presets[selected]);
        clearConsole();
      }
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      const current = document.getElementById('preset-selector').value;
      if (presets[current] !== undefined) {
        editor.setValue(presets[current]);
        clearConsole();
      }
    });

    // Keyboard shortcut Ctrl+Enter / Cmd+Enter
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        executeCode();
      }
    });
  </script>
</body>
</html>
